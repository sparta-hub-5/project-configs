server:
  port: 9090

spring:
  application:
    name: gateway-server

  cloud:
    gateway:
      # 1) Eureka 기반 서비스 디스커버리 → lb:// 서비스명 사용
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true

      # 2) 전역 CORS 설정
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: "http://localhost:3000"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
            allowedHeaders: "*"
            allowCredentials: true

      # 3) 라우팅 설정
      routes:
        - id: hub-service
          uri: lb://hub-service
          predicates:
            - Path=/v1/hub/**
          filters:
            - StripPrefix=1

        - id: product-service
          uri: lb://product-service
          predicates:
            - Path=/v1/product/**
          filters:
            - StripPrefix=1

        - id: user-service
          uri: lb://user-service
          predicates:
            - Path=/v1/user/**
          filters:
            - StripPrefix=1

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://keycloak.code-factory.co.kr/realms/codefactory
      # ⬇️ 이 client 블록은
      # "게이트웨이가 브라우저 로그인까지 직접 처리"할 때만 필요함.
      # SPA가 토큰 들고 오는 구조면 그냥 지워도 됨.
      client:
        registration:
          keycloak:
            client-id: ${KEYCLOAK_CLIENT_ID}
            client-secret: ${KEYCLOAK_CLIENT_SECRET}
            authorization-grant-type: authorization_code
            redirect-uri: "http://localhost:9090/login/oauth2/code/keycloak"
            scope:
              - openid
              - profile
              - email
        provider:
          keycloak:
            issuer-uri: https://keycloak.code-factory.co.kr/realms/codefactory

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://13.210.162.214:3150/eureka/

management:
  endpoint:
    metrics:
      access: READ_ONLY
    prometheus:
      access: READ_ONLY